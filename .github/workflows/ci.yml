name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    name: Birim testleri (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # macOS: sistem tar'ı bsdtar — arşiv girdisi kaçırma kuralları orada doğrulanır
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: C++ motorunu derle (Node-API eklentisi)
        run: npm run build:native
      - name: Sözdizimi denetimi
        run: for f in main.js preload.js src/*.js renderer/*.js scripts/*.js test/*.js; do node --check "$f"; done
      - name: Birim testleri (C++ motoru)
        run: npm run test:unit
        env:
          AEGIS_ENGINE: native
      - name: Birim testleri (JS referans motoru)
        run: npm run test:unit
        env:
          AEGIS_ENGINE: js

  engine:
    name: C++ motoru — CMake, sanitizer, CLI (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Derle (AddressSanitizer + UBSan)
        run: |
          cmake -S native-engine -B native-engine/build-asan -DCMAKE_BUILD_TYPE=Debug -DAEGIS_SANITIZE=ON
          cmake --build native-engine/build-asan --parallel
      - name: C++ birim testleri
        run: ctest --test-dir native-engine/build-asan --output-on-failure
      - name: aegis-scan duman testi
        run: |
          mkdir -p "$RUNNER_TEMP/scan/sub"
          printf 'x AEGIS-TEST-MARKER-V1\n' > "$RUNNER_TEMP/scan/sub/marker.txt"
          printf 'temiz\n' > "$RUNNER_TEMP/scan/clean.txt"
          set +e
          native-engine/build-asan/aegis-scan --json --db signatures "$RUNNER_TEMP/scan" | tee "$RUNNER_TEMP/out.jsonl"
          code=${PIPESTATUS[0]}
          set -e
          test "$code" -eq 1
          grep -q '"threat":"Demo_Test_Marker"' "$RUNNER_TEMP/out.jsonl"
          grep -q '"summary":true,"files":2,' "$RUNNER_TEMP/out.jsonl"

  e2e:
    name: Uçtan uca test (Electron)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:native
      - name: e2e (Xvfb, Electron içinde C++ motoru)
        run: env -u NODE_OPTIONS xvfb-run -a ./node_modules/.bin/electron --no-sandbox test/e2e-scan.js
        env:
          AEGIS_ENGINE: native

  audit:
    name: Bağımlılık güvenlik denetimi
    runs-on: ubuntu-latest
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm audit --audit-level=high

  native:
    name: Native genişletmeler (Swift derleme)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Swift sürümü
        run: swiftc --version
      # Yetkiler (ES/NE) yalnızca çalışma anında gerekir; tip denetimi ve
      # derleme onlarsız yapılabilir. Böylece Swift kodu Linux'ta yazılsa da
      # her PR'da gerçek macOS SDK'sına karşı doğrulanır.
      # Runner'ın SDK'sı macOS 27 API'lerini içermeyebilir: o durumda
      # yalnızca o API'yi kullanan blok AEGIS_PRE_MACOS27_SDK ile dışarıda kalır.
      - name: AegisShield (Endpoint Security)
        run: |
          sdk=$(xcrun --show-sdk-version)
          flags=()
          if [ "${sdk%%.*}" -lt 27 ]; then flags+=(-D AEGIS_PRE_MACOS27_SDK); fi
          echo "macOS SDK $sdk ${flags[*]}"
          swiftc -parse-as-library -O "${flags[@]}" -lEndpointSecurity -lbsm -o "$RUNNER_TEMP/AegisShield" native-daemon/AegisShield.swift
      - name: AegisFirewall (Network Extension)
        if: success() || failure()
        run: swiftc -parse-as-library -O -framework NetworkExtension -lbsm -o "$RUNNER_TEMP/AegisFirewall" native-daemon/AegisFirewall.swift
      - name: Info.plist / entitlements sözdizimi
        if: success() || failure()
        run: |
          plutil -lint native-daemon/Info.plist native-daemon/entitlements.plist build/entitlements.mac.plist
